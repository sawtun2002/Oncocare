<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OncoCare</title>
    <script>
      /* Applies the saved theme before first paint -- without this a dark-mode
         reload flashes the light background until React mounts. Mirrors
         readStoredPreference() in src/context/ThemeContext.jsx; keep the key
         and the "system" fallback identical in both. */
      (function () {
        try {
          var stored = localStorage.getItem("cancer-hms-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          /* Same idea for language: set <html lang> before paint so assistive
             tech and the :lang() font rule apply immediately. Mirrors
             readStoredLanguage() in src/context/LanguageContext.jsx. */
          var lang = localStorage.getItem("cancer-hms-lang");
          document.documentElement.lang = lang === "MY" ? "my" : "en";
        } catch (e) {
          /* Private mode with storage blocked: fall through to the defaults. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
